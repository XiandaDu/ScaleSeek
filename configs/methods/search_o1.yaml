# =====================================================================================
# Search-o1 -- RUC-NLPIR/Search-o1 scripts/run_search_o1.py loop with Qwen3.5-9B
# (BASELINES.md §4 "Search-o1").  The instructions come from scripts/prompts.py at the
# pinned commit and are byte-diffed on every run: single-hop
# get_singleqa_search_o1_instruction, multi-hop get_multiqa_search_o1_instruction (the
# dataset decides, base.yaml `search_o1_instruction`), non-QwQ get_task_instruction_openqa,
# and get_webpage_to_reasonchain_instruction for Reason-in-Documents.  The answer is the
# last \boxed{} (official evaluate.extract_answer, mode='qa').
#
# Differences from the original, all listed in docs/deviations.md:
#   * max_turn 15 -> profile turns; search limit 5/10 -> turns - 1 (template parameter);
#   * temperature 0.7 / top_p 0.8 / top_k 20 / repetition 1.05 / max_tokens 8192 -> profile;
#   * Bing top-10 web pages -> local corpus top-3 (no snippet, so the official
#     "no snippet match" fallback context[:2*max_doc_len] applies).
# =====================================================================================
