# =====================================================================================
# GrepSeek+ -- the official GrepSeek checkpoint and harness (grepseek.yaml, unchanged) with
# the harness-side variants of scaleseek/grepseek_plus.py switched on.  No training, no
# index, no dense retriever; same turns, context window, tool-output cap and decoding.
#   budget  the tool response asks for the answer before the last turn / when the context
#           is almost full, and never takes the room the answering turn needs
#   dedup   the tool response drops `information_lines` (a copy of stdout)
#   fold    non-ASCII patterns as the corpus stores them; empty results retried with -i
#   relax   a result emptied by the filters is retried without the last / all filters
#   title   the article named by the first pattern first, then titles containing it
# Chosen on validation questions only (500 NQ dev + 500 HotpotQA dev outside the test
# subset; scaleseek/grepseek_pilot.py): strict EM 46.5 -> 50.1 (p = 0.002), replicated.
# =====================================================================================
method: grepseek_plus
display_name: GrepSeek+

generator:
  model: alireza7/GrepSeek-Qwen3.5-9B-GRPO
  revision: a79563970cfdd2ced3cc5fde481737d0ebea6fa4

official_repo:
  name: grepseek
  url: https://github.com/alirezasalemi7/grepseek.git
  commit: 1f6ea58372defe774213e22c7650b7fd1b842ab8

server:
  served_model_name: grepseek
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_num_seqs: 32
  seed: 0
  reasoning_parser: qwen3
  # rl/serve_rl.sh also passes --enable-auto-tool-choice --tool-call-parser qwen3_coder.
  # The harness sends no `tools` and parses <tool_call> from the TEXT.  Under the paper's
  # vLLM 0.17 the parser only ran for requests with tools, so the text arrived intact; in
  # vLLM 0.25 it strips the block from `content` and then drops it (no tool_choice), and
  # every turn becomes a parse_error.  Off here = what the official harness received.
  tool_call_parser: null
  enable_auto_tool_choice: false
  language_model_only: true
  trust_remote_code: true

harness:
  max_tokens_per_turn: 0
  variants: [budget, dedup, fold, relax, title]
  tool_max_tokens: {wiki: 2048, bcp: 6000}
  tool_timeout: 60.0
  parallel: 16
  engine_mode: none
  # The harness's OpenAI client gets the same per-request timeout and retries as every
  # other method's client (SDK default 600 s / 2 cut long BCP turns short), via
  # scaleseek/grepseek_entry.py.
  request_timeout_s: 7200
  max_retries: 5

retrieval: null
