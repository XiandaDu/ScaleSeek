# =====================================================================================
# AgentIR -- Qwen3.5-9B driven by the OFFICIAL texttron/AgentIR OSS client
# (evaluation/search_agent/oss_client.py, the model-agnostic scaffold): the user message
# is the official BrowseComp-Plus QUERY_TEMPLATE ("Explanation / Exact Answer /
# Confidence"), the search tool is called through native function calling (OpenAI
# Responses API), and every query is reasoning-aware ("Reasoning: ...\n\nQuery: ..."),
# prefixed with the official instruction and normalised, against a flat inner-product
# AgentIR-4B index built the official way (BASELINES.md §4 "AgentIR").
#
# The official checkout is NOT modified.  scaleseek/agentir_entry.py runs the official
# main() and overrides only (docs/deviations.md):
#   * sampling: every request carries the profile temperature/top_p (the official client
#     sends none) and max_output_tokens=None (official 20000 per response): no per-turn cap;
#   * at most `max_assistant_turns` model calls per question (official --max-iterations is
#     also set to it; the extra guard closes the official loop's uncounted re-calls);
#   * k = 3 (official 5).
# EM/F1 use the `Exact Answer:` line of the final response; the BCP judge gets the whole
# final response, as in the official BrowseComp-Plus evaluation.
# =====================================================================================
method: agentir
display_name: AgentIR

generator:
  model: Qwen/Qwen3.5-9B
  revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a

official_repo:
  name: AgentIR
  url: https://github.com/texttron/AgentIR.git
  commit: 9626bdc7ab90649608d483e66febe13c6eebab2c

server:
  served_model_name: qwen3.5-9b
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.70          # a dense query encoder (~8.5 GB) may share GPU 0
  max_num_seqs: 32
  seed: 0
  # Native function calling: the reasoning parser feeds the per-turn reasoning to the
  # reasoning-aware retriever; qwen3_coder parses Qwen3.5's XML tool calls.
  reasoning_parser: qwen3
  tool_call_parser: qwen3_coder
  enable_auto_tool_choice: true
  language_model_only: true
  trust_remote_code: false

agent:
  scaffold: oss_client
  # Byte-identical to the official scripts.  They pass it through bash double quotes, so
  # "\n" reaches Python as a backslash followed by "n" -- in training (training/train.sh)
  # and evaluation alike.  YAML single quotes keep it that way.
  task_prefix: 'Instruct: Given a user''s reasoning followed by a web search query, retrieve relevant passages that answer the query while incorporating the user''s reasoning\nQuery:'
  reasoning_aware: true
  normalize: true
  pooling: eos
  torch_dtype: float16
  max_length: 8192
  snippet_max_tokens: 512
  snippet_tokenizer: {model: Qwen/Qwen3-0.6B, revision: c1899de289a04d12100db370d81485cdf75e47ca}
  num_threads: 8
  reasoning_effort: high                # official default (--reasoning-effort)

retrieval:
  retrievers: [agentir_4b]
  top_k: 3
