# GRPO for the ScaleSeek agent (verl = the copy vendored in repos/grepseek/verl).
# Started from GrepSeek's paper config (repos/grepseek/rl/grepseek/trainer/config/
# grpo_trainer.yaml); what differs, and why:
#   batch 64 questions x n=8 (GrepSeek 256 x 5), 150 steps   -- ~30% of GrepSeek's trajectories
#   lr 1e-6 (GrepSeek 5e-6)                                   -- no SFT warm start, no KL
#   reward: format-gated EM, drafts at draft_credit           -- scaleseek/agent.py
#   tools: find + search, native Qwen3.5 calls (qwen3_coder)  -- train/scaleseek_rl/
#   rollout TP 2; fused log-prob kernels, no sequence parallel -- 40 GB A100s, 248K vocab (GrepSeek: 80 GB)
# Same as GrepSeek: data NQ + HotpotQA train, 16K context (1024 prompt + 15360), at most
# 5 tool calls + 1 answering turn, temperature 1.0, eager vLLM, full FSDP offload.
#
# Paths come from the environment (train/rl.sbatch sets them): VERL_DIR, SCALESEEK_REPO,
# SCALESEEK_RL_MODEL, SCALESEEK_RL_DATA, SCALESEEK_RL_OUT.

hydra:
  searchpath:
    - file://${oc.env:VERL_DIR}/verl/trainer/config

defaults:
  - actor@actor_rollout_ref.actor: dp_actor
  - data@data: legacy_data
  - ref@actor_rollout_ref.ref: dp_ref
  - rollout@actor_rollout_ref.rollout: rollout
  - model@actor_rollout_ref.model: hf_model
  - reward@reward: reward
  - algorithm@algorithm.rollout_correction: rollout_correction
  - _self_

trainer:
  project_name: scaleseek_grpo
  experiment_name: scaleseek_grpo
  total_epochs: 1
  total_training_steps: 150
  resume_mode: auto
  resume_from_path: null
  del_local_ckpt_after_load: false
  val_before_train: false
  val_only: false
  test_freq: 25
  save_freq: 10                 # jobs are time-limited: resume loses at most 10 steps
  max_actor_ckpt_to_keep: 2
  log_val_generations: 8
  rollout_data_dir: ${trainer.default_local_dir}/train_rollouts
  validation_data_dir: ${trainer.default_local_dir}/val_rollouts
  balance_batch: true
  default_local_dir: ${oc.env:SCALESEEK_RL_OUT}
  default_hdfs_dir: null
  critic_warmup: 0
  esi_redundant_time: 0
  device: cuda
  n_gpus_per_node: 4
  nnodes: 1
  seed: 42
  logger: [console, tensorboard]

# The agent protocol (scaleseek/agent.py): variants switched on, e.g. scaleseek.variants=[budget]
scaleseek:
  variants: []

wandb:
  enable: false
  project: ${trainer.project_name}
  entity: null
  run_name: null

data:
  train_files: ${oc.env:SCALESEEK_RL_DATA}/train.parquet
  val_files: ${oc.env:SCALESEEK_RL_DATA}/dev.parquet
  train_batch_size: 64
  max_prompt_length: 1024
  max_response_length: 15360
  return_raw_chat: true
  prompt_key: prompt
  return_raw_input_ids: false
  return_full_prompt: false
  dataloader_num_workers: 1
  shuffle: true
  seed: 42
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  hybrid_engine: true
  model:
    path: ${oc.env:SCALESEEK_RL_MODEL}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    # log-probs straight from the hidden states (verl models/transformers/qwen3_5.py):
    # 16K tokens x 248K-vocab logits in fp32 alone overflowed a 40 GB A100
    use_fused_kernels: true
    fused_kernel_options:
      impl_backend: torch
  rollout:
    name: vllm
    mode: async
    load_format: safetensors
    enforce_eager: true            # vLLM 0.17 + Qwen3.5 GatedDeltaNet crashes under CUDA graphs (GrepSeek)
    tensor_model_parallel_size: 2
    gpu_memory_utilization: 0.60
    engine_kwargs:
      vllm:
        language_model_only: true
    n: 8
    temperature: 1.0
    top_p: 1.0
    top_k: -1
    max_model_len: 16384
    prompt_length: 1024
    response_length: 15360
    max_num_seqs: 64
    max_num_batched_tokens: 24576
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 16384    # one whole 16K trajectory per GPU (model.use_fused_kernels)
    val_kwargs:
      do_sample: false
    multi_turn:
      enable: true
      max_user_turns: 5
      max_assistant_turns: 6
      max_parallel_calls: 2              # = agent.MAX_PARALLEL_CALLS
      format: qwen3_coder
      tool_config_path: ${oc.env:SCALESEEK_REPO}/train/config/tools.yaml
      interaction_config_path: null
      max_tool_response_length: 100000   # the tools render ~5 passages; no char cut
      tool_response_truncate_side: right
    agent:
      agent_loop_manager_class: null
      num_workers: 4
      default_agent_loop: scaleseek_agent
      agent_loop_config_path: ${oc.env:SCALESEEK_REPO}/train/config/agent_loops.yaml
  actor:
    strategy: fsdp
    freeze_vision_tower: true
    checkpoint:
      save_contents: ['model', 'optimizer', 'extra']
      load_contents: ['model', 'optimizer', 'extra']
    ppo_mini_batch_size: 16          # 64 questions -> 4 updates per step
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 16384
    use_dynamic_bsz: true
    use_kl_loss: false
    kl_loss_coef: 0.0
    fsdp_config:
      wrap_policy:
        transformer_layer_cls_to_wrap: [Qwen3_5DecoderLayer]
      param_offload: true
      grad_offload: true
      optimizer_offload: true
      fsdp_size: 4
      dtype: bfloat16
      model_dtype: bfloat16
    optim:
      optimizer: AdamW
      optimizer_impl: torch.optim
      lr: 1.0e-6
      weight_decay: 0.0
      betas: [0.9, 0.999]
      clip_grad: 1.0
      lr_scheduler_type: constant
      lr_warmup_steps_ratio: 0.0
      lr_warmup_steps: -1
  ref:
    strategy: fsdp
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 16384
    fsdp_config:
      wrap_policy:
        min_num_params: 0
      param_offload: true
      dtype: bfloat16
      model_dtype: bfloat16

critic:
  enable: false
  model:
    enable: false
  strategy: fsdp

reward_model:
  num_workers: null
  enable: false
  enable_resource_pool: false
  use_reward_loop: true
  n_gpus_per_node: 0
  nnodes: 0
  strategy: none
  reward_manager: naive
  reward_loop_source: register
  reward_loop_module_path: null
  reward_loop_class_name: null
  launch_reward_fn_async: false
  model:
    path: null
    input_tokenizer: null
    external_lib: null
    trust_remote_code: false
    override_config: {}
  rollout:
    name: null

reward_manager:
  _target_: verl.trainer.config.config.RewardManagerConfig
  source: register
  name: ${oc.select:reward_model.reward_manager,naive}
  module:
    _target_: verl.trainer.config.config.ModuleConfig
    path: null
    name: custom_reward_manager

custom_reward_function:
  path: ${oc.env:SCALESEEK_REPO}/train/scaleseek_rl/reward.py
  name: compute_score
  reward_kwargs:
    draft_credit: 0.5

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: grpo
  norm_adv_by_std_in_grpo: true
  ppo_epochs: 1
  clip_ratio: 0.2
  value_clip: false
  use_kl_in_reward: false
  kl_penalty: kl
  kl_ctrl:
    type: fixed
    kl_coef: 0.0

sandbox_fusion:
  url: null
  max_concurrent: null
  memory_limit_mb: null

transfer_queue:
  enable: false
  backend:
    storage_backend: SimpleStorage
    SimpleStorage:
      total_storage_size: 100000
      num_data_storage_units: 8

ray_kwargs:
  ray_init:
    ignore_reinit_error: true
    num_cpus: 32
    num_gpus: 4
    include_dashboard: false
  ray_remote:
    num_cpus: 1
  timeline_json_file: null

global_profiler:
  _target_: verl.utils.profiler.ProfilerConfig
  tool: null
  steps: null
  profile_continuous_steps: false
  save_path: null
  global_tool_config: {}
